name: Build LibWrt kmod-fs-ksmbd

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ksmbd - qualcommax/ipq60xx
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. 获取 LibWrt 源码
      - name: Checkout LibWrt
        uses: actions/checkout@v4
        with:
          repository: LiBwrt/LibWrt
          ref: 0c4cd0f9920a420a2ac95b49c1b62130769c08ae
          fetch-depth: 1
          path: libwrt

      # 2. 安装编译依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools \
            python3-yaml python3-jinja2 rsync unzip \
            zlib1g-dev file wget curl libelf-dev swig time kmod

      # 3. 更新 feeds
      - name: Update feeds
        working-directory: libwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 固定 APK 签名密钥
      - name: Install signing key
        working-directory: libwrt
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          set -e
          printf '%s\n' "$APK_PRIVATE_KEY" > private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem

      # 5. 配置编译环境
      - name: Configure build
        working-directory: libwrt
        run: |
          set -e

          cat > .config <<'CFG'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_PACKAGE_kmod-fs-ksmbd=m
          CFG

          make defconfig

          grep -q '^CONFIG_TARGET_qualcommax=y' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config
          grep -q '^CONFIG_PACKAGE_kmod-fs-ksmbd=m' .config

          echo "Configuration passed!"

      # 6. 下载源码
      - name: Download sources
        working-directory: libwrt
        run: |
          make download -j$(nproc)

      # 7. 编译 host tools 和 toolchain
      - name: Build host tools and toolchain
        working-directory: libwrt
        run: |
          set -e
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      # 8. 编译内核
      - name: Build kernel
        working-directory: libwrt
        run: |
          set -e
          make target/linux/compile -j$(nproc) V=s

      # 9. 编译内核模块(含 kmod-fs-ksmbd 及其依赖)
      - name: Compile kernel modules
        working-directory: libwrt
        run: |
          set -e
          make package/kernel/linux/compile -j$(nproc) V=s

      # 10. 收集 ksmbd 及其依赖的 APK
      - name: Collect packages
        working-directory: libwrt
        run: |
          set -e
          mkdir -p output

          for p in kmod-fs-ksmbd kmod-asn1-decoder kmod-oid-registry \
                   kmod-fs-smbfs-common kmod-crypto-des kmod-crypto-md5 \
                   kmod-crypto-sha256; do
            n=$(find bin -type f -name "$p-[0-9]*.apk" | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "WARN: $p 没有找到"
              continue
            fi
            find bin -type f -name "$p-[0-9]*.apk" -exec cp -v {} output/ \;
          done

          # ksmbd 主包必须存在
          ls output/kmod-fs-ksmbd-[0-9]*.apk

          cp public-key.pem output/
          echo "Build results:"
          ls -lh output/

      # 11. 上传 Actions Artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-25.12.2-kmod-fs-ksmbd
          path: libwrt/output/
          compression-level: 9
          if-no-files-found: error
          retention-days: 30

      # 12. 自动创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksmbd-${{ github.run_number }}
          name: LibWrt 25.12.2 kmod-fs-ksmbd Build ${{ github.run_number }}
          body: |
            ## LibWrt kmod-fs-ksmbd

            - Firmware: LibWrt 25.12.2
            - Target: qualcommax
            - Subtarget: ipq60xx
            - Architecture: aarch64_cortex-a53
            - Source Revision: 0c4cd0f9920a
            - Packages: kmod-fs-ksmbd 及其依赖模块

            Automatically compiled by GitHub Actions.

            注意:内核 hash 与固件不一致,请用 apk extract 解包后 insmod,不要直接 apk add。
          files: libwrt/output/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
